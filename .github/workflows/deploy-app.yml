name: Deploy App

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API token authorized to deploy the nxui Worker'
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare account containing the nxui Worker'
        required: true
      NUXT_PUBLIC_OPENPANEL_CLIENT_ID:
        description: 'Public OpenPanel client ID baked into the production bundle'
        required: false
  workflow_dispatch:

# Production deployments are serialized and never cancelled mid-flight — a
# second run waits for the active `wrangler deploy` to finish rather than
# interrupting it and leaving the Worker in a half-applied state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: nuxt.config reads each docs file's last commit date
          # for sitemap <lastmod>.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Build attempt $attempt/$max_attempts..."
            if pnpm run build; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Build failed, retrying in 15s..."
              sleep 15
            fi
          done
          echo "Build failed after $max_attempts attempts"
          exit 1
        env:
          NITRO_PRESET: cloudflare_module
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_PUBLIC_OPENPANEL_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_OPENPANEL_CLIENT_ID }}

      # NUXT_OPENPANEL_CLIENT_SECRET is managed as a Worker secret directly in
      # the Cloudflare dashboard and read at runtime; it is intentionally not
      # supplied here so deploys don't overwrite the dashboard-managed value.
      # Nitro writes the merged wrangler config to .output/server/wrangler.json
      # via cloudflare.deployConfig (see nuxt.config.ts).
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy replaces the `/_nuxt/*` asset set, and the static asset layer
      # answers misses itself with the `_headers` policy for that prefix —
      # `max-age=31536000, immutable`. One miss during the swap therefore pins a
      # broken chunk URL at the edge for a year, and no later deploy can evict
      # it. Purging after the new manifest is live clears both stale documents
      # and cached misses; hashed assets re-warm on first request. Requires the
      # Zone -> Cache Purge scope, and is a recovery net rather than the fix, so
      # a token without that scope must not fail an otherwise good deploy.
      - name: Purge CDN cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo 'CLOUDFLARE_ZONE_ID not set - skipping purge.'
            exit 0
          fi
          status=$(curl -sS -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')
          cat /tmp/purge.json
          test "$status" = '200'

      # IndexNow tells Bing (the index behind ChatGPT search), Yandex, Seznam
      # and Naver that pages changed, so new and updated components get
      # recrawled within hours instead of weeks. The key file lives in public/.
      # A deploy changes the content checksum, so the first requests reseed D1
      # and can take a minute. Wait until pages answer quickly before telling
      # crawlers to come, so they never meet the slow window.
      - name: Warm up docs pages
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            t=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 90 "https://nxui.geoql.in/docs/components/magic-bento?warm=$i")
            echo "attempt $i: $t"
            case "$t" in 200\ [0-4].*) exit 0 ;; esac
            sleep 10
          done
          exit 1

      - name: Ping IndexNow
        continue-on-error: true
        run: |
          urls=$(curl -sS https://nxui.geoql.in/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | head -10000 | jq -R . | jq -s -c .)
          body=$(jq -n -c --argjson u "$urls" '{host:"nxui.geoql.in",key:"de4d002622ebcea117df12b8f6f3da2d",keyLocation:"https://nxui.geoql.in/de4d002622ebcea117df12b8f6f3da2d.txt",urlList:$u}')
          # 403 means IndexNow could not read the key file yet; retry once.
          for attempt in 1 2; do
            status=$(curl -sS -o /tmp/indexnow.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data "$body")
            echo "IndexNow HTTP $status, $(echo "$urls" | jq length) URLs"
            cat /tmp/indexnow.txt
            case "$status" in 200|202) exit 0 ;; esac
            sleep 60
          done
          exit 1
