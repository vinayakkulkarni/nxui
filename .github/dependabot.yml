version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Dependabot's `package-ecosystem: pnpm` is NOT supported yet — tracked in
  # dependabot-core#14794. The `npm` ecosystem auto-detects pnpm-lock.yaml and
  # atomically updates BOTH package.json AND pnpm-lock.yaml in the same PR
  # (pnpm catalog support went GA Feb 2025 under the npm ecosystem).
  # Ref: https://github.blog/changelog/2025-02-04-dependabot-now-supports-pnpm-workspace-catalogs-ga/
  # Ref: https://github.com/dependabot/dependabot-core/issues/14794
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # Vue must resolve to ONE version across the whole graph. Nuxt declares a
    # caret range on the stable line, so a prerelease pin from this manifest
    # (e.g. 3.6.0-rc.x) is NOT satisfied by Nuxt's range — pnpm then installs a
    # second Vue copy and the SSR renderer can no longer see Nuxt's
    # runtime-core instance. useNuxtApp() falls back to a stale global context
    # and every SSR render after the first one per isolate returns 500.
    # Do not let a prerelease Vue in through an automated bump; move the whole
    # graph to 3.6 deliberately, once Nuxt accepts it.
    ignore:
      - dependency-name: vue
        versions: ['>=3.6.0-0']
