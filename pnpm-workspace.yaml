# pnpm 11+ reads ONLY auth/registry keys from .npmrc; every other setting
# lives here in camelCase. Nuxt module deps (@nuxtjs/mdc, @plausible-analytics)
# must be resolvable from the project root for Vite's optimizeDeps, which
# needs a flat public hoist (nuxt/nuxt#31015).
shamefullyHoist: true

# pnpm's supply-chain policy defaults to a 24-hour minimumReleaseAge,
# which blocks legitimate routine dep bumps when CI runs within a day of
# an upstream patch release (e.g. cloudflare/wrangler, cloudflare/miniflare).
# 60 minutes still prevents publish-and-pivot attacks but unblocks normal flow.
minimumReleaseAge: 60

# Nuxt 4.5 declares unhead "^3.1.8", but Unhead 3.1.8 ships an invalid
# unhead/dist/stream/iife.mjs that the Cloudflare preset build cannot parse,
# aborting the CF Workers build (nuxt/nuxt#35670). Fixed in Unhead 3.2.0+;
# pin the floor to >=3.2.1 so the Cloudflare build always resolves a good copy.
#
# mdast-util-to-markdown 2.1.3+ (2026-09-27) serializes emphasis by re-entering
# containerPhrasing; remark-mdc 3.11.1 wraps the emphasis handler, so the two
# recurse until "Maximum call stack size exceeded" and nuxt-llms' /llms-full.txt
# 500s at prerender. Hold 2.1.2 (2.1.3 has the same change) until remark-mdc ships a compatible release.
overrides:
  unhead: '>=3.4.2'
  mdast-util-to-markdown: 2.1.2

# pnpm blocks all package build scripts by default. The allowBuilds
# map below is security-sensitive — true = postinstall runs; false = skipped.
# Warning: pnpm auto-manages this block. Edits made while pnpm install is
# running may be clobbered. If you see an autogenerated duplicate allowBuilds
# block, remove the duplicate and keep THIS one as source of truth.
#   - esbuild: Vite/Nuxt bundler, verifies prebuilt binary matches platform
#   - sharp: image processing for @nuxt/fonts OG image generation
#   - unrs-resolver: Nuxt 4 module resolver, rust-native platform-specific
#   - workerd: Cloudflare Workers runtime used by wrangler
#   - @parcel/watcher: falls back to polling; safe to skip native build
#   - vue-demi: alias/symlink script; not required at runtime
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: false
  workerd: true
